<!DOCTYPE html>
<html lang="en">

<!--
  =====================================================================
  PATCH - COMMUNITY PHONE, LINKED VERSION  (patch-community.html)
  =====================================================================
  This is the screen a resident uses to report a problem.

  LINKED means this page shares its data with patch-business.html and
  patch-worker.html through the browser's storage. A report made here
  shows up on the business page, and when the worker marks it fixed the
  result appears back here. All three pages must be open in the SAME
  browser on the SAME device, and loaded from the same website address.

  Screens in this file:
    1. Loading screen  - "Patch" text with a 10 second bar
    2. Home            - map with a pin and a Report button
    3. Report an issue - photo, damage type, description, Submit
    4. Report sent     - confirmation

  The file has these parts:
    PART 1: <head>   - page title, fonts and all the CSS (colours, layout)
    PART 2: <body>   - the loading screen and an empty phone for the app
    PART 3: <script> - shared data section, then this screen's logic

  The "SHARED DATA" section in the script is identical in all three
  linked files. If you change it in one, change it in all three.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patch - Community</title>

  <!-- Fonts from Google: Barlow Condensed for headings, Barlow for body text -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">

  <style>

    /* ===============================================================
       COLOURS AND SETTINGS
       Change a colour here and it updates across the whole page.
       =============================================================== */
    :root {
      --bg:   #e6e9e8;   /* page background */
      --card: #ffffff;   /* white boxes */
      --ink:  #14181b;   /* main text colour (near black) */
      --mut:  #5d686e;   /* muted grey text */
      --line: #d5dad9;   /* thin borders */
      --or:   #f26a1b;   /* Patch orange (main buttons) */
      --ok:   #17855a;   /* green */
      --bad:  #c93a2b;   /* red */
      --hd: 'Barlow Condensed', 'Arial Narrow', sans-serif;   /* heading font */
    }

    /* Dark mode: used automatically if the person's phone is set to dark */
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101416; --card: #1b2124; --ink: #eef2f3; --mut: #9aa7ad; --line: #2d3639; }
    }

    /* ===============================================================
       BASIC RESETS AND TEXT
       =============================================================== */
    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 Barlow, system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Headings use the condensed "road sign" font */
    h1, h2, h3, .hd { font-family: var(--hd); font-weight: 700; letter-spacing: .2px; }

    /* ===============================================================
       BUTTONS
       =============================================================== */
    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      background: var(--line);
      color: var(--ink);
    }
    button:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--or);      /* orange outline when selected by keyboard */
      outline-offset: 2px;
    }
    .pri { background: var(--or); color: #fff; }      /* main orange button */
    button:disabled { opacity: .5; cursor: default; } /* greyed-out button */

    /* ===============================================================
       LOADING SCREEN (identical in all three Patch files)
       Full-screen black cover with "Patch" and a bar that fills in 10 seconds.
       =============================================================== */
    #load {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: #14181b;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    #load h1 { font-size: 88px; color: #f26a1b; line-height: 1; }
    #load .t { width: min(260px, 70vw); height: 8px; background: #ffffff2a; border-radius: 9px; overflow: hidden; }
    #load .t i { display: block; height: 100%; background: #f26a1b; width: 0; animation: ld 10s linear forwards; }  /* "10s" = loading time */
    @keyframes ld { to { width: 100%; } }
    #load button { background: none; color: #9aa7ad; font-size: 13px; }   /* "Skip loading" link */

    /* ===============================================================
       PHONE FRAME
       The black rounded rectangle that makes the page look like a phone.
       On a real phone this frame disappears and the app fills the screen.
       =============================================================== */
    .stage { display: flex; flex-direction: column; align-items: center; padding: 16px 10px 30px; }

    .ph {
      position: relative;
      width: 390px;
      max-width: 100%;
      height: 780px;
      background: var(--bg);
      border: 10px solid #14181b;
      border-radius: 38px;
      overflow: hidden;
    }

    /* A "screen" is one page inside the phone (home, report, etc.) */
    .scr { position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; }

    /* Black header bar at the top of each screen */
    .bar { background: var(--ink); color: var(--bg); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .bar h2 { font-size: 24px; flex: 1; }
    .bar button { background: #ffffff26; color: inherit; padding: 6px 12px; }

    /* Small "Reset demo" link under the phone (outside the phone frame) */
    .tools { margin-top: 12px; }
    .tools button { background: none; color: var(--mut); font-size: 13px; padding: 4px 8px; text-decoration: underline; }

    /* ===============================================================
       BUILDING BLOCKS
       =============================================================== */
    .pad  { padding: 16px; display: flex; flex-direction: column; gap: 12px; }   /* padded content area */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }  /* white box */

    /* Damage-type buttons on the report page */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { border-radius: 99px; padding: 8px 14px; background: var(--card); border: 2px solid var(--line); }
    .chips button.on { border-color: var(--or); background: var(--or); color: #fff; }   /* the selected type */

    /* Description text box */
    textarea {
      width: 100%;
      min-height: 90px;
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      background: var(--card);
      color: var(--ink);
    }

    /* Photo upload area (dashed box). The real file input is hidden inside it. */
    .up {
      display: flex; align-items: center; justify-content: center;
      min-height: 150px;
      border: 2px dashed var(--mut);
      border-radius: 12px;
      color: var(--mut);
      cursor: pointer;
      overflow: hidden;
      text-align: center;
    }
    .up img   { width: 100%; max-height: 220px; object-fit: cover; }
    .up input { display: none; }

    /* Bottom bar that holds the Submit button.
       "sticky" keeps it pinned to the bottom while the page scrolls. */
    .foot {
      margin-top: auto;
      padding: 14px 16px;
      background: var(--card);
      border-top: 1px solid var(--line);
      position: sticky;
      bottom: 0;
    }
    .foot button { width: 100%; font-size: 17px; }

    .map { width: 100%; display: block; background: #dfe6dc; }   /* the drawn map */

    /* Small rounded tags such as "Critical" */
    .pill { display: inline-block; border-radius: 99px; padding: 2px 10px; font-weight: 600; font-size: 13px; background: var(--line); }
    .Critical { background: #c93a2b; color: #fff; }
    .Medium   { background: #ffc933; color: #14181b; }
    .Fixed    { background: var(--ok); color: #fff; }

    /* Green banner shown when the report has been fixed */
    .ban { background: var(--ok); color: #fff; padding: 12px 16px; font-weight: 600; }

    /* ===============================================================
       SMALL SCREENS (real phones)
       The phone frame goes full screen.
       =============================================================== */
    @media (max-width: 760px) {
      .stage { padding: 0 0 20px; }
      .ph { height: 100dvh; border-width: 0; border-radius: 0; }
    }

  </style>
</head>


<body>

  <!-- ===============================================================
       PART 2: PAGE STRUCTURE
       -->

  <!-- Loading screen (removed after 10 seconds or when "Skip loading" is pressed) -->
  <div id="load">
    <h1 class="hd">Patch</h1>
    <div class="t"><i></i></div>
    <button onclick="skip()">Skip loading</button>
  </div>

  <!-- The phone. The JavaScript below fills it in. -->
  <main class="stage">
    <div class="ph" id="app"></div>
    <div class="tools"><button onclick="resetDemo()">Reset demo (all three pages)</button></div>
  </main>


  <script>

    /* ===============================================================
       PART 3: JAVASCRIPT
       =============================================================== */

    /* Shortcut: $('abc') means "find the element with id abc" */
    const $ = s => document.getElementById(s);


    /* ===============================================================
       SHARED DATA  (identical in all three linked files)
       ---------------------------------------------------------------
       The list of cases is saved in the browser's storage under one
       name (KEY). Every page reads and writes the same list, which is
       how the three pages "talk" to each other.
       =============================================================== */
    const KEY = 'patch_demo_v1';   // the storage name shared by all three pages

    /* The three reports that are already in the system at the start.
       status goes:  Open -> Assigned -> Accepted -> Fixed
       score is used to sort by urgency (higher = more urgent) */
    const SEED = () => [
      { id: 'C-101', title: 'Streetlight out',          loc: 'Smith St',    urgency: 'High',   score: 78, status: 'Open', desc: 'Light out at the crossing. Dark at night.' },
      { id: 'C-102', title: 'Broken bench',             loc: 'Albert Park', urgency: 'Medium', score: 62, status: 'Open', desc: 'Slat missing on the bench by the playground.' },
      { id: 'C-103', title: 'Graffiti on toilet block', loc: 'Albert Park', urgency: 'Low',    score: 30, status: 'Open', desc: 'Tagging on the east wall.' }
    ];

    /* If the browser blocks storage (some private windows do), the app
       falls back to memory. It still works, but the pages cannot share. */
    let useMem = false, mem = null, lastRaw = null;
    try { localStorage.setItem('patch_test', '1'); localStorage.removeItem('patch_test'); } catch (e) { useMem = true; }

    function rawGet() { return useMem ? mem : localStorage.getItem(KEY); }
    function rawSet(v) {
      if (useMem) { mem = v; return true; }
      try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; }   // false = storage full
    }

    /* Read the list of cases (fills in the starting reports if empty) */
    function loadCases() {
      const raw = rawGet();
      if (raw) { try { return JSON.parse(raw); } catch (e) { /* damaged data, start again below */ } }
      const s = SEED();
      saveCases(s);
      return s;
    }

    /* Save the list of cases. Returns false if the browser ran out of room. */
    function saveCases(c) {
      const raw = JSON.stringify(c);
      const ok = rawSet(raw);
      if (ok) lastRaw = raw;
      return ok;
    }

    /* Put everything back to the starting reports */
    function resetAll() { saveCases(SEED()); }

    /* Checks the storage once a second. If another page changed the
       data, the function you pass in (cb) is called so this page can update. */
    function watch(cb) {
      lastRaw = rawGet();
      setInterval(() => {
        const r = rawGet();
        if (r !== lastRaw) { lastRaw = r; cb(); }
      }, 1000);
    }

    /* Shrinks a chosen photo so it fits in storage, then hands back the result */
    function shrinkPhoto(file, done) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 900;                                     // longest side in pixels
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          done(c.toDataURL('image/jpeg', 0.7));                // 0.7 = quality
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    /* ==================== end of SHARED DATA ==================== */


    /* ---------------------------------------------------------------
       LOADING SCREEN
       Removed after 10 seconds, or earlier with "Skip loading".
       --------------------------------------------------------------- */
    function skip() { const l = $('load'); if (l) l.remove(); }
    setTimeout(skip, 10000);   // 10000 milliseconds = 10 seconds


    /* ---------------------------------------------------------------
       THE MAP
       Draws a simple map as an image (SVG). It is an illustration, not
       a live map.
         pin = 1 shows the red damage pin
         me  = 1 shows the blue "you are here" dot
       --------------------------------------------------------------- */
    const MAP = (pin, me) => `
      <svg class="map" viewBox="0 0 300 330" preserveAspectRatio="xMidYMid slice" aria-label="Map">
        <rect width="300" height="330" fill="#dfe6dc"/>
        <rect x="20"  y="30"  width="120" height="110" rx="10" fill="#b9d8b0"/>   <!-- park -->
        <rect x="170" y="190" width="110" height="110" rx="10" fill="#c9dcc2"/>   <!-- green block -->
        <path d="M0 170H300M150 0V330M0 60L300 280" stroke="#fff" stroke-width="14" fill="none"/>   <!-- roads -->
        <path d="M0 170H300M150 0V330" stroke="#c7cdca" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>  <!-- road lines -->
        <text x="34" y="92" font-size="11" fill="#3c6b3a" font-family="Barlow">Albert Park</text>
        ${me ? `
          <circle cx="95" cy="235" r="16" fill="#2b7fff33"/>
          <circle cx="95" cy="235" r="7" fill="#2b7fff" stroke="#fff" stroke-width="3"/>` : ''}
        ${pin ? `
          <path d="M150 120c-13 0-23 10-23 22 0 17 23 38 23 38s23-21 23-38c0-12-10-22-23-22z" fill="#c93a2b" stroke="#fff" stroke-width="3"/>
          <circle cx="150" cy="142" r="8" fill="#fff"/>` : ''}
      </svg>`;


    /* Damage types shown on the report page. Edit the wording here. */
    const TYPES = ['Footpath damage', 'Broken bench', 'Lighting', 'Graffiti', 'Accessibility', 'Other'];


    /* ---------------------------------------------------------------
       APP STATE
       Remembers what the user is doing on this page right now.
       (The cases themselves live in the shared storage above.)
       --------------------------------------------------------------- */
    let st = {
      screen: 'home',   // which screen is showing: 'home', 'report' or 'done'
      photo:  null,     // photo chosen on the report page
      type:   null,     // damage type chosen on the report page
      desc:   ''        // description typed on the report page
    };

    /* The report this user made most recently (marked "mine"), if any */
    const mine = () => [...loadCases()].reverse().find(c => c.mine);


    /* ---------------------------------------------------------------
       PHOTO UPLOAD
       --------------------------------------------------------------- */

    /* The dashed photo box. Shows the chosen photo, or the label if none yet. */
    const up = label => `
      <label class="up">
        ${st.photo ? `<img src="${st.photo}" alt="Chosen photo">` : label}
        <input type="file" accept="image/*" onchange="pickPhoto(event)">
      </label>`;

    /* Runs when someone chooses a photo: shrinks it and saves it in the state */
    function pickPhoto(e) {
      const f = e.target.files[0];
      if (!f) return;
      shrinkPhoto(f, data => { st.photo = data; render(); });
    }


    /* ---------------------------------------------------------------
       BUTTON ACTIONS
       --------------------------------------------------------------- */
    function show(name) { st.screen = name; render(); }

    /* Runs when "Submit report" is pressed: adds a new Critical case
       to the shared list, where the business page will pick it up */
    function submitReport() {
      const cases = loadCases();
      cases.forEach(c => c.mine = false);          // only the newest report counts as "mine"
      cases.push({
        id: 'C-' + (101 + cases.length),
        title: st.type + ' in park',
        type: st.type,
        loc: 'Albert Park, near the oak trees',
        urgency: 'Critical',
        score: 95,                                 // highest score, so it sorts to the top
        status: 'Open',
        desc: st.desc || 'No description added.',
        photo: st.photo,
        mine: true
      });
      if (!saveCases(cases)) { alert('The photo was too big to save. Try a smaller photo.'); return; }
      show('done');
    }

    /* Puts all three pages back to the start */
    function resetDemo() {
      resetAll();
      st = { screen: 'home', photo: null, type: null, desc: '' };
      render();
    }


    /* ===============================================================
       DRAW THE SCREENS
       Three screens: home (map), report form, and "report sent".
       =============================================================== */
    function render() {
      const m = mine();                                    // the user's own report, if any
      if (st.screen === 'done' && !m) st.screen = 'home';  // data was reset elsewhere
      let h = '';

      /* --- HOME: map with pin and Report button --- */
      if (st.screen === 'home') {
        h = `
        <div class="scr">

          <!-- Green banner appears once the worker has marked the report as fixed -->
          ${m && m.status === 'Fixed' ? `<div class="ban">Your report was fixed by ${m.worker}.</div>` : ''}

          <div class="bar"><h2>Patch</h2><span>Albert Park</span></div>

          <div style="flex:1;min-height:0;position:relative">
            ${MAP(1, 1)}

            <!-- Card floating over the map. Before reporting it shows the existing report.
                 After reporting it shows the live status of the user's own report. -->
            ${m ? `
              <div class="card" style="position:absolute;left:12px;right:12px;top:12px">
                <b>${m.title}</b><br>
                <span class="pill ${m.status === 'Fixed' ? 'Fixed' : 'Medium'}">
                  ${m.status === 'Open' ? 'Reported'
                  : m.status === 'Assigned' ? 'Matched to a worker'
                  : m.status === 'Accepted' ? 'Worker on the way'
                  : 'Fixed'}
                </span>
                ${m.status === 'Fixed' && m.fixedPhoto ? `<img src="${m.fixedPhoto}" alt="After the fix" style="width:100%;height:110px;object-fit:cover;border-radius:8px;margin-top:8px">` : ''}
              </div>` : `
              <div class="card" style="position:absolute;left:12px;right:12px;top:12px">
                <b>Uneven path near the oak trees</b><br>
                <span style="color:var(--mut)">Already reported by 3 neighbours</span>
              </div>`}
          </div>

          <div class="foot"><button class="pri" onclick="show('report')">Report an issue</button></div>
        </div>`;
      }

      /* --- REPORT FORM: photo, damage type, description, submit --- */
      if (st.screen === 'report') {
        h = `
        <div class="scr">
          <div class="bar"><button onclick="show('home')">Back</button><h2>Report an issue</h2></div>

          <div class="pad">
            <b>Add a photo</b>
            ${up('Tap to take or choose a photo')}

            <b>Type of damage</b>
            <div class="chips">
              ${TYPES.map(t => `<button class="${st.type === t ? 'on' : ''}" onclick="st.type='${t}';render()">${t}</button>`).join('')}
            </div>

            <b>Describe the problem</b>
            <textarea oninput="st.desc=this.value" placeholder="What is damaged and why is it a risk?">${st.desc}</textarea>

            <div class="card" style="color:var(--mut)">Location: Albert Park, near the oak trees</div>
          </div>

          <!-- Submit stays disabled until a damage type is chosen -->
          <div class="foot">
            <button class="pri" ${st.type ? '' : 'disabled'} onclick="submitReport()">
              ${st.type ? 'Submit report' : 'Choose a type to submit'}
            </button>
          </div>
        </div>`;
      }

      /* --- CONFIRMATION: shown right after submitting --- */
      if (st.screen === 'done') {
        h = `
        <div class="scr">
          <div class="bar"><h2>Report sent</h2></div>
          <div class="pad">
            <div class="card">
              <h3 style="font-size:26px">Thanks, we have your report</h3>
              <p>Council has it now and will match it to a skilled local worker. You will see updates here.</p>
            </div>
            <div class="card">
              <b>${m.title}</b><br>
              <span class="pill Critical">Critical</span> <span class="pill">Case ${m.id}</span>
            </div>
          </div>
          <div class="foot"><button class="pri" onclick="show('home')">Back to map</button></div>
        </div>`;
      }

      $('app').innerHTML = h;
    }


    /* ---------------------------------------------------------------
       KEEP IN SYNC
       When another page changes the data, redraw this page.
       The report form is skipped so typing is never interrupted.
       --------------------------------------------------------------- */
    watch(() => { if (st.screen !== 'report') render(); });

    /* Start the app */
    render();

  </script>
</body>
</html>
