<!DOCTYPE html>
<html lang="en">

<!--
  =====================================================================
  PATCH - WORKER PHONE (MATT), LINKED VERSION  (patch-worker.html)
  =====================================================================
  This is the screen a tradesperson (Matt) uses to accept a job and
  mark it as fixed.

  LINKED means this page shares its data with patch-community.html and
  patch-business.html through the browser's storage. When the business
  assigns a case to Matt, it appears here. When Matt marks it fixed,
  the business and community pages update. All three pages must be open
  in the SAME browser on the SAME device, and loaded from the same
  website address.

  Screens in this file (the page picks the right one automatically):
    1. Loading screen - "Patch" text with a 10 second bar
    2. No jobs        - shown until the business assigns Matt a case
    3. New job        - map (left) and photo (right) at the top, details
                        on a black background, Reject / Accept buttons
    4. Update case    - upload a photo of the fix, press Fixed (it lights
                        up green), add a description, Submit
    5. Job submitted  - confirmation

  The file has these parts:
    PART 1: <head>   - page title, fonts and all the CSS (colours, layout)
    PART 2: <body>   - the loading screen and an empty phone for the app
    PART 3: <script> - shared data section, then this screen's logic

  The "SHARED DATA" section in the script is identical in all three
  linked files. If you change it in one, change it in all three.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patch - Worker</title>

  <!-- Fonts from Google: Barlow Condensed for headings, Barlow for body text -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">

  <style>

    /* ===============================================================
       COLOURS AND SETTINGS
       Change a colour here and it updates across the whole page.
       =============================================================== */
    :root {
      --bg:   #e6e9e8;   /* page background */
      --card: #ffffff;   /* white boxes */
      --ink:  #14181b;   /* main text colour (near black) */
      --mut:  #5d686e;   /* muted grey text */
      --line: #d5dad9;   /* thin borders */
      --or:   #f26a1b;   /* Patch orange (main buttons) */
      --ok:   #17855a;   /* green (accept / fixed) */
      --bad:  #c93a2b;   /* red (reject / critical) */
      --hd: 'Barlow Condensed', 'Arial Narrow', sans-serif;   /* heading font */
    }

    /* Dark mode: used automatically if the person's phone is set to dark */
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101416; --card: #1b2124; --ink: #eef2f3; --mut: #9aa7ad; --line: #2d3639; }
    }

    /* ===============================================================
       BASIC RESETS AND TEXT
       =============================================================== */
    * { box-sizing: border-box; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 Barlow, system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Headings use the condensed "road sign" font */
    h1, h2, h3, .hd { font-family: var(--hd); font-weight: 700; letter-spacing: .2px; }

    /* ===============================================================
       BUTTONS
       =============================================================== */
    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      background: var(--line);
      color: var(--ink);
    }
    button:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--or);      /* orange outline when selected by keyboard */
      outline-offset: 2px;
    }
    .pri { background: var(--or); color: #fff; }                                        /* main orange button */
    .ok  { background: var(--ok); color: #fff; }                                        /* green button (Accept) */
    .no  { background: transparent; border: 2px solid var(--bad); color: var(--bad); }  /* red outline (Reject) */
    button:disabled { opacity: .5; cursor: default; }                                   /* greyed-out button */

    /* ===============================================================
       LOADING SCREEN (identical in all three Patch files)
       Full-screen black cover with "Patch" and a bar that fills in 10 seconds.
       =============================================================== */
    #load {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: #14181b;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    #load h1 { font-size: 88px; color: #f26a1b; line-height: 1; }
    #load .t { width: min(260px, 70vw); height: 8px; background: #ffffff2a; border-radius: 9px; overflow: hidden; }
    #load .t i { display: block; height: 100%; background: #f26a1b; width: 0; animation: ld 10s linear forwards; }  /* "10s" = loading time */
    @keyframes ld { to { width: 100%; } }
    #load button { background: none; color: #9aa7ad; font-size: 13px; }   /* "Skip loading" link */

    /* ===============================================================
       PHONE FRAME
       The black rounded rectangle that makes the page look like a phone.
       On a real phone this frame disappears and the app fills the screen.
       =============================================================== */
    .stage { display: flex; flex-direction: column; align-items: center; padding: 16px 10px 30px; }

    .ph {
      position: relative;
      width: 390px;
      max-width: 100%;
      height: 780px;
      background: var(--bg);
      border: 10px solid #14181b;
      border-radius: 38px;
      overflow: hidden;
    }

    /* A "screen" is one page inside the phone */
    .scr { position: absolute; inset: 0; overflow: auto; display: flex; flex-direction: column; }

    /* Black header bar at the top of each screen */
    .bar { background: var(--ink); color: var(--bg); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .bar h2 { font-size: 24px; flex: 1; }

    /* Small "Reset demo" link under the phone (outside the phone frame) */
    .tools { margin-top: 12px; }
    .tools button { background: none; color: var(--mut); font-size: 13px; padding: 4px 8px; text-decoration: underline; }

    /* ===============================================================
       BUILDING BLOCKS
       =============================================================== */
    .pad  { padding: 16px; display: flex; flex-direction: column; gap: 12px; }   /* padded content area */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }  /* white box */

    /* Description text box */
    textarea {
      width: 100%;
      min-height: 90px;
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      background: var(--card);
      color: var(--ink);
    }

    /* Photo upload area (dashed box). The real file input is hidden inside it. */
    .up {
      display: flex; align-items: center; justify-content: center;
      min-height: 150px;
      border: 2px dashed var(--mut);
      border-radius: 12px;
      color: var(--mut);
      cursor: pointer;
      overflow: hidden;
      text-align: center;
    }
    .up img   { width: 100%; max-height: 220px; object-fit: cover; }
    .up input { display: none; }

    /* Bottom bar that holds the buttons.
       "sticky" keeps it pinned to the bottom while the page scrolls. */
    .foot {
      margin-top: auto;
      padding: 14px 16px;
      background: var(--card);
      border-top: 1px solid var(--line);
      position: sticky;
      bottom: 0;
    }
    .foot button { width: 100%; font-size: 17px; }

    .map { width: 100%; display: block; background: #dfe6dc; }   /* the drawn map */

    /* Photo box. Shows a grey striped placeholder if there is no photo. */
    .ph-img {
      height: 170px;
      overflow: hidden;
      background: repeating-linear-gradient(135deg, #8b8f90, #8b8f90 12px, #9a9ea0 12px, #9a9ea0 24px);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-weight: 600;
      text-align: center;
    }
    .ph-img img { width: 100%; height: 100%; object-fit: cover; }

    /* Small rounded tags such as "Critical" */
    .pill { display: inline-block; border-radius: 99px; padding: 2px 10px; font-weight: 600; font-size: 13px; background: var(--line); }
    .Critical { background: #c93a2b; color: #fff; }
    .High     { background: #f26a1b; color: #fff; }
    .Medium   { background: #ffc933; color: #14181b; }
    .Low      { background: #cfd8d5; color: #14181b; }

    /* ===============================================================
       NEW JOB SCREEN
       Map (left) and photo (right) side by side at the top,
       then job details on a black background.
       =============================================================== */
    .top2 { display: grid; grid-template-columns: 1fr 1fr; height: 190px; flex: none; }
    .top2 > div { overflow: hidden; height: 100%; min-width: 0; }
    .top2 .map  { height: 100%; }
    .top2 .ph-img { height: 100%; }

    .blk { background: #14181b; color: #fff; flex: 1; }   /* the black details panel */
    .blk .pill:not(.Critical):not(.High):not(.Medium):not(.Low) { background: #2d3639; color: #fff; }   /* dark tags so the white text is readable */

    /* Black button bar for the Reject / Accept buttons */
    .foot.dark { display: flex; gap: 10px; background: #14181b; border-top-color: #2d3639; }

    /* ===============================================================
       UPDATE CASE SCREEN: STATUS BUTTONS
       The "Fixed" button glows green when selected.
       =============================================================== */
    .fx { display: flex; gap: 8px; }
    .fx button { flex: 1; border: 2px solid var(--line); background: var(--card); }
    .fx button.lit {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
      box-shadow: 0 0 0 4px #17855a44, 0 0 18px #17855a99;   /* the glow */
    }

    /* ===============================================================
       SMALL SCREENS (real phones)
       The phone frame goes full screen.
       =============================================================== */
    @media (max-width: 760px) {
      .stage { padding: 0 0 20px; }
      .ph { height: 100dvh; border-width: 0; border-radius: 0; }
    }

  </style>
</head>


<body>

  <!-- ===============================================================
       PART 2: PAGE STRUCTURE
       -->

  <!-- Loading screen (removed after 10 seconds or when "Skip loading" is pressed) -->
  <div id="load">
    <h1 class="hd">Patch</h1>
    <div class="t"><i></i></div>
    <button onclick="skip()">Skip loading</button>
  </div>

  <!-- The phone. The JavaScript below fills it in. -->
  <main class="stage">
    <div class="ph" id="app"></div>
    <div class="tools"><button onclick="resetDemo()">Reset demo (all three pages)</button></div>
  </main>


  <script>

    /* ===============================================================
       PART 3: JAVASCRIPT
       =============================================================== */

    /* Shortcut: $('abc') means "find the element with id abc" */
    const $ = s => document.getElementById(s);


    /* ===============================================================
       SHARED DATA  (identical in all three linked files)
       ---------------------------------------------------------------
       The list of cases is saved in the browser's storage under one
       name (KEY). Every page reads and writes the same list, which is
       how the three pages "talk" to each other.
       =============================================================== */
    const KEY = 'patch_demo_v1';   // the storage name shared by all three pages

    /* The three reports that are already in the system at the start.
       status goes:  Open -> Assigned -> Accepted -> Fixed
       score is used to sort by urgency (higher = more urgent) */
    const SEED = () => [
      { id: 'C-101', title: 'Streetlight out',          loc: 'Smith St',    urgency: 'High',   score: 78, status: 'Open', desc: 'Light out at the crossing. Dark at night.' },
      { id: 'C-102', title: 'Broken bench',             loc: 'Albert Park', urgency: 'Medium', score: 62, status: 'Open', desc: 'Slat missing on the bench by the playground.' },
      { id: 'C-103', title: 'Graffiti on toilet block', loc: 'Albert Park', urgency: 'Low',    score: 30, status: 'Open', desc: 'Tagging on the east wall.' }
    ];

    /* If the browser blocks storage (some private windows do), the app
       falls back to memory. It still works, but the pages cannot share. */
    let useMem = false, mem = null, lastRaw = null;
    try { localStorage.setItem('patch_test', '1'); localStorage.removeItem('patch_test'); } catch (e) { useMem = true; }

    function rawGet() { return useMem ? mem : localStorage.getItem(KEY); }
    function rawSet(v) {
      if (useMem) { mem = v; return true; }
      try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; }   // false = storage full
    }

    /* Read the list of cases (fills in the starting reports if empty) */
    function loadCases() {
      const raw = rawGet();
      if (raw) { try { return JSON.parse(raw); } catch (e) { /* damaged data, start again below */ } }
      const s = SEED();
      saveCases(s);
      return s;
    }

    /* Save the list of cases. Returns false if the browser ran out of room. */
    function saveCases(c) {
      const raw = JSON.stringify(c);
      const ok = rawSet(raw);
      if (ok) lastRaw = raw;
      return ok;
    }

    /* Put everything back to the starting reports */
    function resetAll() { saveCases(SEED()); }

    /* Checks the storage once a second. If another page changed the
       data, the function you pass in (cb) is called so this page can update. */
    function watch(cb) {
      lastRaw = rawGet();
      setInterval(() => {
        const r = rawGet();
        if (r !== lastRaw) { lastRaw = r; cb(); }
      }, 1000);
    }

    /* Shrinks a chosen photo so it fits in storage, then hands back the result */
    function shrinkPhoto(file, done) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 900;                                     // longest side in pixels
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          done(c.toDataURL('image/jpeg', 0.7));                // 0.7 = quality
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    /* ==================== end of SHARED DATA ==================== */


    /* ---------------------------------------------------------------
       LOADING SCREEN
       Removed after 10 seconds, or earlier with "Skip loading".
       --------------------------------------------------------------- */
    function skip() { const l = $('load'); if (l) l.remove(); }
    setTimeout(skip, 10000);   // 10000 milliseconds = 10 seconds


    /* ---------------------------------------------------------------
       THE MAP
       Draws a simple map as an image (SVG). It is an illustration, not
       a live map.
         pin = 1 shows the red damage pin
         me  = 1 shows the blue "you are here" dot
       --------------------------------------------------------------- */
    const MAP = (pin, me) => `
      <svg class="map" viewBox="0 0 300 330" preserveAspectRatio="xMidYMid slice" aria-label="Map">
        <rect width="300" height="330" fill="#dfe6dc"/>
        <rect x="20"  y="30"  width="120" height="110" rx="10" fill="#b9d8b0"/>   <!-- park -->
        <rect x="170" y="190" width="110" height="110" rx="10" fill="#c9dcc2"/>   <!-- green block -->
        <path d="M0 170H300M150 0V330M0 60L300 280" stroke="#fff" stroke-width="14" fill="none"/>   <!-- roads -->
        <path d="M0 170H300M150 0V330" stroke="#c7cdca" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>  <!-- road lines -->
        <text x="34" y="92" font-size="11" fill="#3c6b3a" font-family="Barlow">Albert Park</text>
        ${me ? `
          <circle cx="95" cy="235" r="16" fill="#2b7fff33"/>
          <circle cx="95" cy="235" r="7" fill="#2b7fff" stroke="#fff" stroke-width="3"/>` : ''}
        ${pin ? `
          <path d="M150 120c-13 0-23 10-23 22 0 17 23 38 23 38s23-21 23-38c0-12-10-22-23-22z" fill="#c93a2b" stroke="#fff" stroke-width="3"/>
          <circle cx="150" cy="142" r="8" fill="#fff"/>` : ''}
      </svg>`;


    /* ---------------------------------------------------------------
       APP STATE
       Remembers what Matt is typing on this page right now.
       (The cases themselves live in the shared storage above.)
       --------------------------------------------------------------- */
    let st = {
      photo: null,     // photo Matt uploads of the fix
      fixed: false,    // has Matt pressed the "Fixed" button?
      desc:  '',       // description Matt types
      msg:   ''        // short message on the "No jobs" screen (e.g. after rejecting)
    };

    /* Which screen is showing right now, so we only redraw when it changes */
    let shownKey = '';


    /* ---------------------------------------------------------------
       FINDING MATT'S JOB
       The page works out which screen to show from the shared data:
         job assigned to Matt, not yet accepted  -> New job
         job accepted by Matt                    -> Update case
         otherwise, a job Matt has fixed         -> Job submitted
         otherwise                               -> No jobs
       --------------------------------------------------------------- */
    const activeJob = () => loadCases().find(c => c.worker === 'Matt' && (c.status === 'Assigned' || c.status === 'Accepted'));
    const lastDone  = () => [...loadCases()].reverse().find(c => c.worker === 'Matt' && c.status === 'Fixed');

    function screenKey() {
      const j = activeJob();
      if (j) return (j.status === 'Assigned' ? 'offer-' : 'update-') + j.id;
      const d = lastDone();
      return d ? 'done-' + d.id : 'idle';
    }


    /* ---------------------------------------------------------------
       PHOTO UPLOAD
       --------------------------------------------------------------- */

    /* The dashed photo box. Shows the chosen photo, or the label if none yet. */
    const up = label => `
      <label class="up">
        ${st.photo ? `<img src="${st.photo}" alt="Chosen photo">` : label}
        <input type="file" accept="image/*" onchange="pickPhoto(event)">
      </label>`;

    /* Runs when someone chooses a photo: shrinks it and saves it in the state */
    function pickPhoto(e) {
      const f = e.target.files[0];
      if (!f) return;
      shrinkPhoto(f, data => { st.photo = data; render(); });
    }


    /* ---------------------------------------------------------------
       BUTTON ACTIONS
       --------------------------------------------------------------- */

    /* Matt accepts the job: the business and community pages see "Accepted" */
    function accept(id) {
      const cases = loadCases();
      cases.find(c => c.id === id).status = 'Accepted';
      saveCases(cases);
      render();
    }

    /* Matt rejects the job: it goes back to Open so the business can pick someone else */
    function reject(id) {
      const cases = loadCases();
      const c = cases.find(x => x.id === id);
      c.rejected = c.worker;   // remember who rejected, to show a message to the business
      c.worker = null;
      c.status = 'Open';
      saveCases(cases);
      st.msg = 'You rejected that job. It has gone back to the business to assign to someone else.';
      render();
    }

    /* Matt submits the update: the case becomes Fixed and keeps his photo and note */
    function finish(id) {
      const cases = loadCases();
      const c = cases.find(x => x.id === id);
      c.status = 'Fixed';
      c.fixedPhoto = st.photo;
      c.note = st.desc;
      if (!saveCases(cases)) { alert('The photo was too big to save. Try a smaller photo.'); return; }
      render();
    }

    /* Puts all three pages back to the start */
    function resetDemo() {
      resetAll();
      st = { photo: null, fixed: false, desc: '', msg: '' };
      render();
    }


    /* ===============================================================
       DRAW THE SCREENS
       =============================================================== */
    function render() {
      shownKey = screenKey();
      const j = activeJob();
      let h = '';

      /* --- NEW JOB: map + photo on top, details on black, Reject / Accept --- */
      if (j && j.status === 'Assigned') {
        h = `
        <div class="scr">
          <div class="bar"><h2>New local job</h2></div>

          <!-- Map on the left, photo (uploaded by the community member) on the right -->
          <div class="top2">
            <div>${MAP(1, 1)}</div>
            <div class="ph-img">${j.photo ? `<img src="${j.photo}" alt="Damage">` : 'Photo of damage'}</div>
          </div>

          <!-- Job details on the black background -->
          <div class="pad blk">
            <h3 style="font-size:28px">${j.title}</h3>
            <div>
              <span class="pill ${j.urgency}">${j.urgency}</span>
              <span class="pill">0.8 km away</span>
              <span class="pill">Council-approved site</span>
            </div>
            <p>${j.desc}</p>
          </div>

          <!-- Reject sends the case back to the business. Accept moves to the update form. -->
          <div class="foot dark">
            <button class="no" style="flex:1" onclick="reject('${j.id}')">Reject</button>
            <button class="ok" style="flex:2" onclick="accept('${j.id}')">Accept job</button>
          </div>
        </div>`;
      }

      /* --- UPDATE CASE: photo of the fix, Fixed button, description, submit --- */
      else if (j) {
        h = `
        <div class="scr">
          <div class="bar"><h2>Update case</h2></div>

          <div class="pad">
            <b>${j.title}</b>

            <b>Photo of the fixed area</b>
            ${up('Tap to upload a photo of the repair')}

            <!-- The Fixed button lights up green when pressed -->
            <b>Status</b>
            <div class="fx">
              <button onclick="st.fixed=false;render()">In progress</button>
              <button class="${st.fixed ? 'lit' : ''}" onclick="st.fixed=true;render()">${st.fixed ? 'Fixed ✓' : 'Fixed'}</button>
            </div>

            <b>Description</b>
            <textarea oninput="st.desc=this.value" placeholder="What did you do?">${st.desc}</textarea>
          </div>

          <!-- Submit is disabled until Fixed is selected -->
          <div class="foot">
            <button class="pri" ${st.fixed ? '' : 'disabled'} onclick="finish('${j.id}')">
              ${st.fixed ? 'Submit update' : 'Select Fixed to submit'}
            </button>
          </div>
        </div>`;
      }

      /* --- JOB SUBMITTED, or NO JOBS --- */
      else {
        const d = lastDone();
        /* A message (such as after rejecting a job) comes first, then the
           "Job submitted" confirmation, then the empty "No new jobs" state */
        const title = st.msg ? 'Job rejected' : d ? 'Job submitted' : 'No new jobs';
        const text  = st.msg ? st.msg
                    : d ? 'Thanks Matt. ' + d.title + ' is marked as fixed and the reporter has been told.'
                    : 'New jobs near you will appear here.';
        h = `
        <div class="scr">
          <div class="bar"><h2>Matt's jobs</h2></div>
          <div class="pad">
            <div class="card">
              <h3 style="font-size:24px">${title}</h3>
              <p>${text}</p>
            </div>
          </div>
        </div>`;
      }

      $('app').innerHTML = h;
    }


    /* ---------------------------------------------------------------
       KEEP IN SYNC
       When another page changes the data, check which screen Matt
       should see. The page is only redrawn if that screen has
       changed, so anything Matt is typing is never wiped out.
       --------------------------------------------------------------- */
    watch(() => {
      if (screenKey() !== shownKey) {
        st.photo = null; st.fixed = false; st.desc = ''; st.msg = '';   // fresh form for the new screen
        render();
      }
    });

    /* Start the app */
    render();

  </script>
</body>
</html>
